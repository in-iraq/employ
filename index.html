<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة بيانات الممرضين - القراءة الحقيقية للبطاقة</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        .id-card-frame {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1.58 / 1;
            border: 3px dashed #0284c7;
            border-radius: 12px;
            background-color: #0f172a;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">استمارة جمع بيانات الممرضين</h1>
            <p class="text-sm text-slate-500 mt-1">التعرف الذكي وقراءة البيانات الحقيقية من البطاقة الوطنية</p>
        </div>

        <form id="nurseForm" class="space-y-5">
            
            <!-- إطار الكاميرا الحية والذكاء الاصطناعي -->
            <div>
                <label class="block text-sm font-bold text-sky-700 mb-2 text-center">اجعل البطاقة الموحدة داخل الإطار واضغط على زر القراءة</label>
                
                <div class="id-card-frame">
                    <video id="cameraStream" autoplay playsinline muted></video>
                    <canvas id="snapshotCanvas" class="hidden"></canvas>
                    
                    <div id="scannerOverlay" class="absolute inset-0 border-2 border-sky-400 bg-sky-500/10 flex flex-col items-center justify-center transition-all duration-300 pointer-events-none">
                        <div class="absolute top-2 bg-slate-900/90 text-sky-300 text-[11px] px-3 py-1 rounded-full font-semibold shadow" id="scannerStatus">
                            الكاميرا متوقفة
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-center gap-3 mt-3">
                    <button type="button" onclick="startCamera()" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg shadow">
                        تشغيل الكاميرا
                    </button>
                    <button type="button" onclick="captureAndScan()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow">
                        قراءة النصوص الحقيقية 🔍
                    </button>
                </div>
            </div>

            <!-- الاسم الرباعي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">الاسم الرباعي واللقب (المستخرج)</label>
                <input type="text" id="fullName" required placeholder="سيظهر الاسم المستخرج من البطاقة هنا" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- اسم الام الثلاثي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الأم الثلاثي (المستخرج)</label>
                <input type="text" id="motherName" required placeholder="سيظهر اسم الأم المستخرج هنا" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- الجنس وتاريخ الميلاد -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">الجنس</label>
                    <select id="gender" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-white">
                        <option value="">اختر الجنس</option>
                        <option value="ذكر">ذكر</option>
                        <option value="أنثى">أنثى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">تاريخ الميلاد</label>
                    <input type="date" id="dob" required 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-white">
                </div>
            </div>

            <!-- العنوان الوظيفي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">العنوان الوظيفي</label>
                <input type="text" id="jobTitle" required placeholder="مثال: ممرض جامعي / ردهة الطوارئ" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- رقم البطاقة الموحدة -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">رقم البطاقة الموحدة (المستخرج)</label>
                <input type="text" id="cardIdNumber" required placeholder="سيظهر رقم البطاقة هنا" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- زر التأكيد والإرسال -->
            <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base">
                تأكيد وإرسال البيانات
            </button>

        </form>
    </div>

    <script>
        let videoStream = null;

        async function startCamera() {
            try {
                const videoElement = document.getElementById('cameraStream');
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                
                videoElement.srcObject = videoStream;
                document.getElementById('scannerStatus').innerText = "الكاميرا تعمل - وجه البطاقة الموحدة بدقة";
            } catch (error) {
                alert("تعذر تشغيل الكاميرا، يجدر التأكد من أذونات المتصفح.");
            }
        }

        async function captureAndScan() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('snapshotCanvas');
            const status = document.getElementById('scannerStatus');

            if (!video.srcObject) {
                alert("يرجى تشغيل الكاميرا أولاً!");
                return;
            }

            status.innerText = "جاري قراءة النصوص الحقيقية من البطاقة...";
            status.className = "absolute top-2 bg-amber-600 text-white text-[11px] px-3 py-1 rounded-full font-bold animate-pulse";

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/png');

            try {
                // استخراج النصوص الحقيقية عبر Tesseract OCR باللغة العربية والإنجليزية
                const result = await Tesseract.recognize(
                    imageDataUrl,
                    'ara+eng',
                    { logger: m => console.log(m) }
                );

                const text = result.data.text;
                console.log("النص الخام المستخرج:", text);

                // التحقق من أن البطاقة هي البطاقة الوطنية العراقية الفعلية (وليس بطاقة أخرى أو ورقة عادية)
                const isIraqiID = text.includes("وزارة الداخلية") || text.includes("الجمهورية") || text.includes("البطاقة") || text.includes("الأحوال");

                if (!isIraqiID) {
                    status.innerText = "✗ عذراً، البطاقة غير مطابقة للنموذج العراقي الرسمي";
                    status.className = "absolute top-2 bg-rose-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";
                    alert("لم يتم التعرف على معالم البطاقة الوطنية الموحدة النموذجية. يرجى التأكد من توجيه البطاقة الصحيحة داخل الإطار.");
                    return;
                }

                status.innerText = "✓ تم التحقق وقراءة النصوص الحقيقية بنجاح!";
                status.className = "absolute top-2 bg-emerald-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";

                // استخراج الأرقام (مثل رقم البطاقة الموحدة) من النص الفعلي
                const numbersMatch = text.match(/\d{6,}/g);
                if (numbersMatch && numbersMatch.length > 0) {
                    document.getElementById('cardIdNumber').value = numbersMatch[0];
                }

                // محاولة استخراج أو تنظيف النصوص للأسماء (تقسيم الأسطر وإيجاد الكلمات الدالة)
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 3);
                
                let detectedName = "";
                let detectedMother = "";

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    if (line.includes("الاسم") || line.includes("اسم")) {
                        if (i + 1 < lines.length) detectedName = lines[i + 1];
                    }
                    if (line.includes("الأم") || line.includes("الام")) {
                        if (i + 1 < lines.length) detectedMother = lines[i + 1];
                    }
                }

                // إذا لم يتم العثور على الأسطر بدقة تلقائية مطلقة من الصورة، نضع النص المستخرج الفعلي كبديل ليتسنى للمستخدم تعديله
                document.getElementById('fullName').value = detectedName || (lines[0] ? lines[0] : "يرجى تعديل الاسم يمتنع الخطأ");
                document.getElementById('motherName').value = detectedMother || (lines[1] ? lines[1] : "يرجى تعديل اسم الأم");

            } catch (err) {
                status.innerText = "فشل في عملية القراءة، حاول مرة أخرى";
                status.className = "absolute top-2 bg-rose-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";
            }
        }

        window.onload = function() {
            startCamera();
        };

        document.getElementById('nurseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال البيانات والتحقق من البطاقة الموحدة بنجاح!');
        });
    </script>
</body>
</html>
