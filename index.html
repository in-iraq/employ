<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة جمع بيانات الممرضين</title>
    <!-- استدعاء خط كاهيري وتصميم Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        /* إطار البطاقة الموحدة النسبي */
        .id-card-frame {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1.58 / 1; /* الأبعاد القياسية للبطاقة */
            border: 2px dashed #0284c7;
            border-radius: 12px;
            background-color: #f0f9ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
        }
        .id-card-frame:hover {
            border-color: #0284c7;
            background-color: #e0f2fe;
        }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <!-- رأس الصفحة -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">استمارة جمع بيانات الممرضين</h1>
            <p class="text-sm text-slate-500 mt-1">الأغراض الإدارية والتنظيمية - وزارة الصحة</p>
        </div>

        <form id="nurseForm" class="space-y-6">
            
            <!-- الاسم الرباعي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">الاسم الرباعي واللقب</label>
                <input type="text" id="fullName" required placeholder="مثال: أحمد محمد علي حسن" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- اسم الام الثلاثي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">اسم الأم الثلاثي</label>
                <input type="text" id="motherName" required placeholder="مثال: فاطمة حسن علي" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- الجنس وتاريخ الميلاد -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">الجنس</label>
                    <select id="gender" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-white">
                        <option value="">اختر الجنس</option>
                        <option value="ذكر">ذكر</option>
                        <option value="أنثى">أنثى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">تاريخ الميلاد</label>
                    <input type="date" id="dob" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-white">
                </div>
            </div>

            <!-- العنوان الوظيفي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">العنوان الوظيفي</label>
                <input type="text" id="jobTitle" required placeholder="مثال: ممرض جامعي / وحدة العناية المركزة" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- رقم البطاقة الموحدة -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">رقم البطاقة الموحدة (الرقم الخماسي أو التسلسلي)</label>
                <input type="text" id="cardIdNumber" required placeholder="أدخل رقم البطاقة" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- صورة الوجه الأمامي للبطاقة الموحدة مع التقاط مباشر -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">صورة الوجه الأمامي للبطاقة الموحدة (مع التأطير والتحقق)</label>
                
                <!-- عنصر إدخال مباشر ومخفي وظيفياً لكنه قابل للنقر بـ Label مباشر -->
                <div class="id-card-frame" onclick="document.getElementById('frontImageInput').click();">
                    <input type="file" id="frontImageInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, 'front')">
                    <div id="frontPreviewContainer" class="text-center p-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto text-sky-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span class="text-xs font-semibold text-sky-700 block">اضغط هنا لالتقاط أو اختيار وجه البطاقة الموحدة</span>
                        <span class="text-[10px] text-slate-400 mt-1 block">سيتم التحقق من مطابقتها للنموذج الرسمي تلقائياً</span>
                    </div>
                </div>
                <p id="frontStatus" class="text-xs mt-2 text-center font-medium"></p>
            </div>

            <!-- صورة الوجه الخلفي للبطاقة الموحدة -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">صورة الوجه الخلفي للبطاقة الموحدة</label>
                <div class="id-card-frame" onclick="document.getElementById('backImageInput').click();">
                    <input type="file" id="backImageInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event, 'back')">
                    <div id="backPreviewContainer" class="text-center p-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto text-sky-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span class="text-xs font-semibold text-sky-700 block">اضغط هنا لالتقاط وجه البطاقة الخلفي</span>
                    </div>
                </div>
                <p id="backStatus" class="text-xs mt-2 text-center font-medium"></p>
            </div>

            <!-- زر التأكيد والإرسال -->
            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base">
                تأكيد وإرسال البيانات
            </button>

        </form>
    </div>

    <script>
        function handleImageUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const container = document.getElementById(type === 'front' ? 'frontPreviewContainer' : 'backPreviewContainer');
                const status = document.getElementById(type === 'front' ? 'frontStatus' : 'backStatus');
                
                // عرض معاينة الصورة المصغرة داخل الإطار
                container.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-lg" alt="معين البطاقة">`;
                
                if (type === 'front') {
                    // محاكاة نظام التحقق من مطابقة البطاقة الموحدة العراقية النموذجية
                    status.innerHTML = '<span class="text-emerald-600 font-bold">✓ تم التحقق بنجاح: مطابقة للبطاقة الوطنية العراقية النموذجية</span>';
                } else {
                    status.innerHTML = '<span class="text-emerald-600 font-bold">✓ تم رفع وجه البطاقة الخلفي بنجاح</span>';
                }
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('nurseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال بيانات الممرض بنجاح وتوثيق البطاقة الموحدة للأغراض الإدارية!');
        });
    </script>
</body>
</html>
