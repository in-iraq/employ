<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة بيانات الممرضين - قراءة البطاقة الوطنية العراقية</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        .id-card-frame {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1.58 / 1;
            border: 3px dashed #0284c7;
            border-radius: 12px;
            background-color: #0f172a;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">استمارة جمع بيانات الممرضين</h1>
            <p class="text-sm text-slate-500 mt-1">التعرف الذكي وقراءة حقول البطاقة الوطنية الموحدة</p>
        </div>

        <form id="nurseForm" class="space-y-5">
            
            <!-- إطار الكاميرا الحية والذكاء الاصطناعي -->
            <div>
                <label class="block text-sm font-bold text-sky-700 mb-2 text-center">اجعل البطاقة الوطنية الموحدة داخل الإطار تماماً</label>
                
                <div class="id-card-frame">
                    <video id="cameraStream" autoplay playsinline muted></video>
                    <canvas id="snapshotCanvas" class="hidden"></canvas>
                    
                    <div id="scannerOverlay" class="absolute inset-0 border-2 border-sky-400 bg-sky-500/10 flex flex-col items-center justify-center transition-all duration-300 pointer-events-none">
                        <div class="absolute top-2 bg-slate-900/90 text-sky-300 text-[11px] px-3 py-1 rounded-full font-semibold shadow" id="scannerStatus">
                            الكاميرا متوقفة
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-center gap-3 mt-3">
                    <button type="button" onclick="startCamera()" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg shadow">
                        تشغيل الكاميرا
                    </button>
                    <button type="button" onclick="captureAndScan()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow">
                        مسح وقراءة البطاقة 🔍
                    </button>
                </div>
            </div>

            <!-- الاسم الرباعي (الاسم + الأب + الجد + اللقب) -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">الاسم الرباعي واللقب (حسب البطاقة)</label>
                <input type="text" id="fullName" required placeholder="يُستخرج تلقائياً (الاسم / الأب / الجد / اللقب)" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- اسم الام الثلاثي (اسم الأم / أب الأم / جد الأم) -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الأم الثلاثي (حسب البطاقة)</label>
                <input type="text" id="motherName" required placeholder="يُستخرج تلقائياً (الأم / أب الأم / جد الأم)" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- الجنس وتاريخ الميلاد -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">الجنس</label>
                    <select id="gender" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-white">
                        <option value="">اختر الجنس</option>
                        <option value="ذكر">ذكر</option>
                        <option value="أنثى">أنثى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">تاريخ الميلاد</label>
                    <input type="date" id="dob" required 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-white">
                </div>
            </div>

            <!-- العنوان الوظيفي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">العنوان الوظيفي</label>
                <input type="text" id="jobTitle" required placeholder="مثال: ممرض جامعي / ردهة الطوارئ" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- رقم البطاقة الموحدة -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">رقم البطاقة الموحدة</label>
                <input type="text" id="cardIdNumber" required placeholder="رقم البطاقة التسلسلي" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- زر التأكيد والإرسال -->
            <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base">
                تأكيد وإرسال البيانات
            </button>

        </form>
    </div>

    <script>
        let videoStream = null;

        async function startCamera() {
            try {
                const videoElement = document.getElementById('cameraStream');
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                
                videoElement.srcObject = videoStream;
                document.getElementById('scannerStatus').innerText = "الكاميرا تعمل - جاهز لمسح البطاقة الموحدة";
            } catch (error) {
                alert("تعذر تشغيل الكاميرا، يرجى السماح للمتصفح بالوصول للكاميرا.");
            }
        }

        async function captureAndScan() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('snapshotCanvas');
            const status = document.getElementById('scannerStatus');

            if (!video.srcObject) {
                alert("يرجى تشغيل الكاميرا أولاً!");
                return;
            }

            status.innerText = "جاري قراءة حقول البطاقة الموحدة...";
            status.className = "absolute top-2 bg-amber-600 text-white text-[11px] px-3 py-1 rounded-full font-bold animate-pulse";

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/png');

            try {
                const result = await Tesseract.recognize(
                    imageDataUrl,
                    'ara+eng',
                    { logger: m => console.log(m) }
                );

                const text = result.data.text;
                console.log("النص المستخرج:", text);

                // التحقق الصارم من أن البطاقة هي البطاقة الوطنية العراقية الرسمية
                const isIraqiID = text.includes("وزارة الداخلية") || text.includes("الجمهورية") || text.includes("البطاقة الوطنية") || text.includes("الأحوال المدنية");

                if (!isIraqiID) {
                    status.innerText = "✗ بطاقة غير مطابقة للنموذج العراقي الرسمي";
                    status.className = "absolute top-2 bg-rose-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";
                    alert("عذراً، هذه ليست البطاقة الوطنية الموحدة المطلوبة. يرجى توجيه البطاقة النموذجية الصحيحة.");
                    return;
                }

                status.innerText = "✓ تمت قراءة البطاقة الوطنية الموحدة بنجاح!";
                status.className = "absolute top-2 bg-emerald-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";

                // استخراج رقم البطاقة (الأرقام المتسلسلة)
                const numbersMatch = text.match(/\d{5,}/g);
                if (numbersMatch && numbersMatch.length > 0) {
                    document.getElementById('cardIdNumber').value = numbersMatch[numbersMatch.length - 1];
                }

                // الكشف التلقائي عن الجنس من النص
                if (text.includes("ذكر") || text.includes("مذكر")) {
                    document.getElementById('gender').value = "ذكر";
                } else if (text.includes("أنثى") || text.includes("مونث")) {
                    document.getElementById('gender').value = "أنثى";
                }

                // استخراج الأسطر لتعبئة الاسم الرباعي واسم الأم الثلاثي بدقة حسب الحقول المقابلة
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
                
                let extractedNameParts = [];
                let extractedMotherParts = [];
                let captureMode = '';

                for (let line of lines) {
                    if (line.includes("الاسم") || line.includes("الأب") || line.includes("الجد") || line.includes("اللقب")) {
                        captureMode = 'name';
                        continue;
                    } else if (line.includes("الأم") || line.includes("دابيك") || line.includes("دايك")) {
                        captureMode = 'mother';
                        continue;
                    }

                    if (captureMode === 'name' && extractedNameParts.length < 4) {
                        extractedNameParts.push(line);
                    } else if (captureMode === 'mother' && extractedMotherParts.length < 3) {
                        extractedMotherParts.push(line);
                    }
                }

                // تعبئة الحقول بالأسماء المستخرجة الفعلية أو النصوص المتوفرة
                if (extractedNameParts.length > 0) {
                    document.getElementById('fullName').value = extractedNameParts.join(' ');
                } else {
                    document.getElementById('fullName').value = lines.slice(0, 4).join(' ');
                }

                if (extractedMotherParts.length > 0) {
                    document.getElementById('motherName').value = extractedMotherParts.join(' ');
                } else {
                    document.getElementById('motherName').value = lines.slice(4, 7).join(' ');
                }

            } catch (err) {
                status.innerText = "فشل في عملية القراءة، أعد المحاولة";
                status.className = "absolute top-2 bg-rose-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";
            }
        }

        window.onload = function() {
            startCamera();
        };

        document.getElementById('nurseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم تأكيد بيانات الممرض وقراءة البطاقة الموحدة بنجاح!');
        });
    </script>
</body>
</html>
