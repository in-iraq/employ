<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة جمع بيانات الممرضين - التعرف التلقائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        /* إطار الكاميرا الحية للبطاقة الموحدة */
        .id-card-frame {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1.58 / 1;
            border: 3px dashed #0284c7;
            border-radius: 12px;
            background-color: #0f172a;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="py-6 px-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">استمارة جمع بيانات الممرضين</h1>
            <p class="text-sm text-slate-500 mt-1">التعرف التلقائي المباشر من البطاقة الوطنية الموحدة</p>
        </div>

        <form id="nurseForm" class="space-y-5">
            
            <!-- إطار الكاميرا الحية للتعرف التلقائي -->
            <div>
                <label class="block text-sm font-bold text-sky-700 mb-2 text-center">وجه كاميرا الهاتف نحو البطاقة الموحدة داخل الإطار أدناه</label>
                
                <div class="id-card-frame">
                    <!-- بث الكاميرا المباشر -->
                    <video id="cameraStream" autoplay playsinline muted></video>
                    
                    <!-- طبقة توجيه بصرية -->
                    <div id="scannerOverlay" class="absolute inset-0 border-2 border-emerald-400 bg-emerald-500/10 flex flex-col items-center justify-center transition-all duration-300 pointer-events-none">
                        <div class="absolute top-2 bg-slate-900/80 text-emerald-300 text-[11px] px-3 py-1 rounded-full font-semibold animate-pulse" id="scannerStatus">
                            جاري البحث عن البطاقة الموحدة...
                        </div>
                    </div>
                </div>
                
                <div class="flex justify-center gap-3 mt-3">
                    <button type="button" onclick="startCamera()" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold rounded-lg shadow">
                        تشغيل الكاميرا
                    </button>
                    <button type="button" onclick="simulateAutoDetect()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow">
                        محاكاة القراءة التلقائية الفورية
                    </button>
                </div>
            </div>

            <!-- الاسم الرباعي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">الاسم الرباعي واللقب</label>
                <input type="text" id="fullName" required placeholder="يُملأ تلقائياً عند المطابقة" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- اسم الام الثلاثي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الأم الثلاثي</label>
                <input type="text" id="motherName" required placeholder="يُملأ تلقائياً عند المطابقة" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- الجنس وتاريخ الميلاد -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">الجنس</label>
                    <select id="gender" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
                        <option value="">اختر الجنس</option>
                        <option value="ذكر">ذكر</option>
                        <option value="أنثى">أنثى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">تاريخ الميلاد</label>
                    <input type="date" id="dob" required 
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
                </div>
            </div>

            <!-- العنوان الوظيفي -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">العنوان الوظيفي</label>
                <input type="text" id="jobTitle" required placeholder="مثال: ممرض جامعي / ردهة الطوارئ" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm">
            </div>

            <!-- رقم البطاقة الموحدة -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">رقم البطاقة الموحدة</label>
                <input type="text" id="cardIdNumber" required placeholder="يُملأ تلقائياً" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none text-slate-700 text-sm bg-slate-50">
            </div>

            <!-- زر التأكيد والإرسال -->
            <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base">
                تأكيد وإرسال البيانات
            </button>

        </form>
    </div>

    <script>
        // تشغيل كاميرا الهاتف الخلفية داخل الإطار
        async function startCamera() {
            try {
                const videoElement = document.getElementById('cameraStream');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } } // استخدام الكاميرا الخلفية حصراً للهواتف
                }).catch(() => {
                    // إذا لم توفر الكاميرا الخلفية بدقة، يتم فتح أي كاميرا متاحة
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                
                videoElement.srcObject = stream;
                document.getElementById('scannerStatus').innerText = "الكاميرا نشطة - وجه البطاقة داخل الإطار";
                
                // بدء محاكاة الالتقاط التلقائي الناجح بعد 3 ثوانٍ من ظهور الكاميرا
                setTimeout(simulateAutoDetect, 3500);
            } catch (error) {
                alert("تعذر الوصول للكاميرا مباشرة. يجدر التأكد من منح الإذن للمتصفح، أو استخدم زر محاكاة القراءة الفورية.");
            }
        }

        // دالة محاكاة التعرف التلقائي وملء الحقول فور مطابقة البطاقة
        function simulateAutoDetect() {
            document.getElementById('scannerStatus').innerText = "✓ تم التعرف على البطاقة النموذجية بنجاح!";
            document.getElementById('scannerStatus').className = "absolute top-2 bg-emerald-600 text-white text-[11px] px-3 py-1 rounded-full font-bold";

            // ملء الحقول تلقائياً بمعلومات مطابقة للبطاقة النموذجية
            document.getElementById('fullName').value = "أحمد محمد علي حسن";
            document.getElementById('motherName').value = "فاطمة حسن علي";
            document.getElementById('gender').value = "ذكر";
            document.getElementById('dob').value = "1995-06-12";
            document.getElementById('cardIdNumber').value = "10492837";
        }

        // تشغيل الكاميرا تلقائياً عند فتح الصفحة
        window.onload = function() {
            startCamera();
        };

        document.getElementById('nurseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم اعتماد البيانات وتوثيق البطاقة الوطنية الموحدة بنجاح!');
        });
    </script>
</body>
</html>
